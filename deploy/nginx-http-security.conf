# /etc/nginx/conf.d/family-planner-security.conf  (http context)
server_tokens off;                                    # hide the Nginx version
log_format honeypot '$remote_addr - [$time_local] "$request" $status "$http_user_agent"';
# Per-IP request limits. /api/plan is the costly endpoint (Google Places + Weather), so it gets the tight one.
limit_req_zone $binary_remote_addr zone=fwp_api:10m  rate=5r/s;
limit_req_zone $binary_remote_addr zone=fwp_plan:10m rate=20r/m;
limit_req_status 429;
