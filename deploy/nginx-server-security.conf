# /etc/nginx/snippets/family-planner-security.conf  (included inside the 443 server block)
# Security headers. 'unsafe-inline' styles are needed by Leaflet (inline positioning) and MUI/Emotion (runtime <style>).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;

# Honeypot: paths no real visitor of this app requests, only scanners. Logged separately; fail2ban bans on the first hit.
location ~* ^/(\.env|\.git|\.aws|\.ssh|wp-login\.php|wp-admin|xmlrpc\.php|phpmyadmin|pma|admin\.php|config\.php|server-status|vendor/phpunit|cgi-bin|actuator|boaform) {
    access_log /var/log/nginx/honeypot.log honeypot;
    return 404;
}

# The plan endpoint calls paid Google APIs: tight per-IP limit, GET only.
location = /api/plan {
    limit_except GET HEAD { deny all; }
    limit_req zone=fwp_plan burst=10 nodelay;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_read_timeout 90s;
}

# Caching: always revalidate the HTML shell so a deploy is picked up on the next load;
# hashed build assets never change, so they can be cached for a year.
# (`expires` is used instead of add_header so the security headers above are still inherited.)
location = / { expires -1; try_files /index.html =404; }
location = /index.html { expires -1; }
location /assets/ { expires 1y; }
